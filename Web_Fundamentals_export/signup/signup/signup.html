<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            margin: auto;
            width: 500px;
            background-color: white;
            height: 800px;
            border: 10px solid darkblue;
            border-radius: 30px;
            display: grid;
            grid-template-rows: 2fr.5fr 4fr;
            text-align: center;

        }

        #header {
            background: url("images/jesus_feeds_5000.jpeg");
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            border-radius: 10px;
        }
        #header h1 {
            margin-top: 70px;
        }
    #header h1,
    #header h2 { color: aliceblue;
    
    }


        #closeBtn {
            position: absolute;
            top: 12px;
            margin-right: 10px;
            margin-left: 0px;
            margin-top:10px;
        }

        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
align-items: center;
row-gap: 10px;
padding: 0 50px;
        }
        #myForm label {
            justify-self: start;
        }
         #myForm div { justify-self: end;
        }
         #myForm input {justify-self: end;

        }

        #myForm section {
            grid-column: 1/3;
            
        }

        h3 {
            text-align: center;
            font-size: larger;
            margin-top: 10px;
        }
        footer {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;

        }
        footer img {
            width:90px;
            height: 120px;
        }
        #leftSideStuff {
    position: fixed; 
    top: 50px;       
    left: 20px;     
    width: 200px;
    color: white;
  font-family: monospace;
  display: inline-block;      
  overflow: hidden; 
  font-size: x-large;

}    
    </style>




</head>

<body>
    <div id="leftSideStuff">
        <h2>2 Nephi 32:3</h2>
        <p>...Wherefore, I said unto you, feast upon the words of Christ; for behold, the words of Christ will tell you all things what ye should do.</p>
        </div>
    <div id="formContainer">
        <div id="header">
            <h1>
                Daily Feed
            </h1>
            <h2>
                Scripture a day
            </h2>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>
            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>
            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>

         <footer>
        <div>
            <img src="images\old_testament.webp" alt="">
        </div>
        <div>
            <img src="images\new_testament.webp" alt="">
        </div>
        <div>
            <img src="images\book_of_mormon.webp" alt="">
        </div>
        <div>
            <img src="images\doctrine_and_covenants.webp" alt="">
        </div>
        <div>
         <img src="images\pearl_of_great_price.webp" alt="">
        </div>
        </footer>

    </div>

    <div id="output"></div>


    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
        });
    </script>

</body>

</html>
