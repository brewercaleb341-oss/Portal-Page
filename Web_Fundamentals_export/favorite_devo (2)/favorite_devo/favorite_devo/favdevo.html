<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .input {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
    align-items:center;

    }
    
    h2 {
      
    }
    
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
     <table style="width:100%"; border="1">
      <th>Speaker</th>
      <th>Title</th>
      <th>Location</th>
      <th>Year</th>
      <tr>
        <td>Selena Robins</td>
        <td>Spiritual Discernment</td>
        <td>BYUI</td>
        <td>2026</td>
      </tr>
      <tr>
        <td>Trent Shippen</td>
        <td>Become Legendary</td>
        <td>BYUI</td>
        <td>2026</td>
      </tr>
      <tr>
        <td>Elder Robert C. Gay</td>
        <td>Be True to the Voice of God</td>
        <td>BYUI</td>
        <td>2026</td>
      </tr>
      </table>
<h2>Add a devotional to the list</h2>
<form Class="input">
  <label for="Speaker">Speaker:</label>
  <input type="text" id="Speaker"> 
  <label for="Title">Title:</label>
  <input type="text" id="Title">
  <label for="Location">Location:</label>
  <input type="text" id="Location">
  <label for="Year">Year:</label>
  <input type="text" id="Year">

</form>
     
      </div>
    </main>
  </div>
</body>
</html>
